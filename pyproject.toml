[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compton-suite"
version = "0.1.0"
description = "Shared physical constants, pint registry, and parameter-semantics/convention framework for the Compton-GUIde + xigma-i + kascade suite"
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
dependencies = [
    "numpy",
    "pint>=0.24"
]
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "src"
