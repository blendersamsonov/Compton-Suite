[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compton-io"
version = "0.1.0"
description = "Shared physical constants, pint registry, parameter-semantics/convention framework, and electron-bunch/laser-pulse representations for the ComptonSuite toolkit"
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
dependencies = [
    "numpy",
    "pint>=0.24",
    "pyyaml"
]
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "src"
