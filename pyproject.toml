[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compton-suite"
version = "0.1.0"
description = "Inverse-Compton scattering physics simulation toolkit: shared framework (io), GUI (gui), and models (kascade, xigma_i, delta, analytical)"
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pint>=0.24",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["cupy>=13.6"]
cpu = ["numba>=0.55"]

[project.scripts]
comptonsuite-gui = "compton_suite.gui:run_gui"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compton_suite*"]