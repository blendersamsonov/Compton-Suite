[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xigma-i"
version = "1.0.0"
description = "Compton radiation source simulation tools"
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.11"
]
requires-python = ">=3.14"

# cupy (GPU backend) and numba (CPU fallback backend) are both optional at
# the package level -- xigma_i.core.Compton auto-detects which is available
# and usable at runtime (see core._detect_device), so a machine only needs
# one of the two installed, not both. Install with `pip install xigma-i[gpu]`
# on a CUDA machine, `xigma-i[cpu]` otherwise, or both to allow either.
[project.optional-dependencies]
gpu = ["cupy>=13.6"]
cpu = ["numba>=0.55"]

[tool.setuptools.package-dir]
"" = "src"