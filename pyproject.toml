[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xigma-direct"
version = "0.1.0"
description = "Brute-force per-macroparticle resonance-binning Compton model, reusing xigma_i's Stage 0 physics directly (no table, no importance sampling)."
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
dependencies = [
    "numpy",
]
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "src"
