[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compton-suite"
version = "0.1.0"
description = "Umbrella package gluing ComptonSuite's pieces together (compton_io, compton_guide, and the models/ physics engines: kascade, xigma_i, xigma_direct, analytical)."
authors = [{name = "Alexander Samsonov", email = "asams@ipfran.ru"}]
dependencies = [
    "numpy",
    "scipy",
    "compton-io",
    "compton-guide",
]
requires-python = ">=3.10"

[project.scripts]
comptonsuite-gui = "compton_suite.gui:run_gui"

[tool.setuptools.package-dir]
"" = "src"
