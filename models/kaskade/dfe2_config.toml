# =============================================================================
# dfe2_config.toml  --  input parameters for dfe2_compton_mc.py
# =============================================================================
# Human-readable configuration for the inverse-Compton (Thomson) Monte-Carlo.
# All values are SI unless the comment says otherwise.  Any key may be omitted;
# omitted keys fall back to the built-in defaults in Config (dfe2_compton_mc.py).
#
# The defaults below describe a representative X-ray inverse-Compton source:
# ~51 MeV electrons (gamma = 100) on a 1 um laser, giving an on-axis
# backscattered photon energy of ~4 gamma^2 hbar omega_L ~ 50 keV.
# -----------------------------------------------------------------------------

[electron_bunch]
eps0          = 100.0      # central energy / (m_e c^2)   (= Lorentz gamma)
sigma_eps_rel = 0.01       # relative rms energy spread   sigma_eps / eps0
emit_x        = 1.0e-9     # geometric emittance, x       [m rad]
emit_y        = 1.0e-9     # geometric emittance, y       [m rad]
sigma0_x      = 10.0e-6    # rms transverse size at waist, x   [m]
sigma0_y      = 10.0e-6    # rms transverse size at waist, y   [m]
sigma_par_e   = 50.0e-6    # rms bunch length             [m]
N_e           = 1.0e9      # number of electrons in the bunch

[laser]
lambda_L      = 1.0e-6     # laser wavelength             [m]
sigma0_l      = 20.0e-6    # rms transverse size at waist [m]
R_sf          = 0.0        # transverse focusing range (Rayleigh) [m];
                           #   0 -> auto = pi (2 sigma0_l)^2 / lambda_L
sigma_par_L   = 1.0e-3     # rms laser pulse length       [m]
pulse_energy_J = 1.0       # laser pulse energy           [J]
N_L           = 0.0        # number of laser photons; 0 -> from pulse_energy

[geometry]
# collision offsets; centres coincide at maximum overlap, t = 0
delta_x       = 0.0        # transverse offset, x         [m]
delta_y       = 0.0        # transverse offset, y         [m]
delta_z       = 0.0        # longitudinal offset          [m]

[model]
# True  -> electron transverse angle shifted by L_theta per photon
#          (faithful to f_{e,f,1} in dfe2.lyx)
# False -> electron angle unchanged (photon angle still recorded)
apply_doc_angular_kick = true

[numerics]
n_time        = 161        # samples for the 1-D N_gamma1 time integral
n_sigma_time  = 6.0        # half-window of that integral, in sigma_t
chunk         = 20000      # electrons processed per chunk

[run]
# driver options consumed by main() (not part of the physics Config)
n_mc          = 200000     # number of macro-electrons to sample
seed          = 1          # RNG seed for reproducibility
# outdir      = "."        # where to write plots; omit -> next to the script
