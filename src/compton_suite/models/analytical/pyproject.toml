[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compton-analytical"
version = "0.1.0"
description = "Fast, closed-form Compton-source physics: total yield, angle-integrated spectrum, and spectrum-width estimates"
dependencies = [
    "numpy",
    "scipy",
    "compton-io"
]
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["analytical", "analytical_adapter"]
