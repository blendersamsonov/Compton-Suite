# =============================================================================
# dfe5_config.toml  --  input parameters for dfe5_compton_mc.py
# =============================================================================
# Generalised inverse-Compton Monte-Carlo: arbitrary collision (crossing) angle
# plus an optional quantum branch (Klein-Nishina cross section + electron
# recoil). All values SI unless noted. Any key may be omitted (falls back to the
# Config default); unknown keys raise an error.
#
# crossing_angle = 0 and quantum = false reproduce the head-on classical
# (Thomson) dfe4 model.
# -----------------------------------------------------------------------------

[electron_bunch]
eps0          = 4000.0     # central energy / (m_e c^2)   (= Lorentz gamma, ~2 GeV)
sigma_eps_rel = 0.0001     # relative rms energy spread   sigma_eps / eps0 (0.01%)
emit_x        = 1.0e-14    # geometric emittance, x       [m rad]
emit_y        = 1.0e-14    # geometric emittance, y       [m rad]
sigma0_x      = 2.0e-6     # rms transverse size at waist, x   [m]
sigma0_y      = 2.0e-6     # rms transverse size at waist, y   [m]
sigma_par_e   = 50.0e-6    # rms bunch length             [m]
N_e           = 1.0e9      # number of electrons in the bunch

[laser]
lambda_L      = 1.0e-6     # laser wavelength             [m]
sigma0_l      = 10.0e-6    # rms transverse size at waist [m]
R_sf          = 0.0        # transverse focusing range (Rayleigh) [m];
                           #   0 -> auto = pi (2 sigma0_l)^2 / lambda_L
sigma_par_L   = 1.0e-3     # rms laser pulse length       [m]
pulse_energy_J = 0.3       # laser pulse energy           [J]
N_L           = 0.0        # number of laser photons; 0 -> from pulse_energy

[geometry]
# collision offsets; centres coincide at maximum overlap, t = 0
delta_x        = 0.0       # transverse offset, x         [m]
delta_y        = 0.0       # transverse offset, y         [m]
delta_z        = 0.0       # longitudinal offset          [m]
# crossing angle: laser tilt away from exact head-on counter-propagation.
# 0 = head-on (laser along -z). The laser propagates along (sin phi, 0, -cos phi).
crossing_angle = 0.0       # [rad]

[quantum]
# false -> classical Thomson (as dfe4).
# true  -> Klein-Nishina differential/total cross section + single-photon
#          electron recoil (edge red-shifted to D*eps_L/(1+X), X = recoil param).
#          Important only when the rest-frame photon energy k = gamma*eps_L*
#          (1 - beta cos alpha) approaches ~1; negligible for typical ICS.
quantum        = false

[output_window]
# restrict the "in window" counters to |theta_x| <= Theta_x and
# |theta_y| <= Theta_y (lab-frame photon angle). 0 -> no cut on that axis.
Theta_x       = 0.0        # half-width photon angle cut, x   [rad]
Theta_y       = 0.0        # half-width photon angle cut, y   [rad]

[on_axis]
# on-axis (round) collimator: keep photons with gamma*theta_lab < value.
theta_onaxis_gamma = 0.2   # acceptance half-angle in units of 1/gamma

[numerics]
n_time        = 201        # samples for the cumulative optical-depth grid
n_sigma_time  = 6.0        # half-window of that integral, in sigma_t
max_photons   = 30         # safety cap on generations per electron
chunk         = 5000       # electrons processed per chunk

[run]
# driver options consumed by main() (not part of the physics Config)
n_mc          = 20000      # number of macro-electrons to sample
seed          = 1          # RNG seed for reproducibility
# outdir      = "."        # where to write plots; omit -> next to the script
